{% extends 'base.html' %}
{% block title %}个人中心 - 二手交易平台{% endblock %}
{% block content %}
<div class="container py-5">
    <h3 class="mb-4">个人中心</h3>
    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body text-center">
                    {% if profile.avatar %}
                    <img src="{{ profile.avatar.url }}" class="avatar-lg mb-3">
                    {% else %}
                    <div class="avatar-lg bg-light d-flex align-items-center justify-content-center mx-auto mb-3">
                        <i class="bi bi-person display-4 text-muted"></i>
                    </div>
                    {% endif %}
                    <h5>{{ user.username }}</h5>
                    <p class="text-muted">{{ profile.phone }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-4">编辑个人信息</h5>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">昵称</label>
                            <input type="text" class="form-control" name="nickname" value="{{ profile.nickname|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" name="email" value="{{ user.email|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">手机号</label>
                            <input type="tel" class="form-control" name="phone" value="{{ profile.phone|default:'' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">收货地址</label>
                            <textarea class="form-control" name="address" rows="3">{{ profile.address|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">头像</label>
                            <input type="file" class="form-control" name="avatar" accept="image/*">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">保存修改</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
